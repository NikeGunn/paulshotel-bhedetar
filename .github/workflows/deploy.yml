name: Deploy

# Production CD to Vercel on every push to main.
#
# Triggered DIRECTLY by push-to-main (not via workflow_run) so it can never be
# orphaned or cancelled by unrelated CI runs. The job re-runs the quality gate
# (lint + types + build) first, then deploys.
#
# DORMANT until secrets exist: with no VERCEL_TOKEN the deploy step is skipped
# cleanly and the run still goes green ("coming soon"). Add VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID as repo secrets and the next push goes live.
#
# Note: PR preview deployments are handled by Vercel's own Git integration
# (no token in CI), so no token is ever exposed to untrusted fork PR code.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# Never interrupt an in-flight production deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: vercel-production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Quality gate — production must never ship a red build.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://paulshotel-bhedetar.vercel.app

      # Secret gate: only deploy when a Vercel token is configured.
      - name: Check for Vercel secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::No VERCEL_TOKEN/ORG_ID/PROJECT_ID yet. Build is green; add the secrets to go live."
          fi

      - name: Install Vercel CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm i -g vercel@latest

      # Vercel enforces that the deploy's git-commit author be a team member.
      # GitHub squash-merges author commits as the noreply email, which is not
      # a Vercel seat -> deploy is BLOCKED ("Git author ... must have access").
      # Re-author the (ephemeral, CI-only) HEAD commit as the Vercel account
      # email so the author check passes. This is never pushed back to GitHub.
      - name: Re-author HEAD for Vercel git-author check
        if: steps.gate.outputs.ready == 'true'
        env:
          VERCEL_EMAIL: ${{ secrets.VERCEL_ACCOUNT_EMAIL }}
        run: |
          EMAIL="${VERCEL_EMAIL:-knewboy.nykhil@gmail.com}"
          git config user.email "$EMAIL"
          git config user.name "Paul's Hotel Deploy"
          git commit --amend --no-edit --reset-author
          echo "HEAD now authored by $(git log -1 --format='%ae')"

      - name: Pull Vercel env
        if: steps.gate.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build
        if: steps.gate.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          # --archive=tgz uploads a single tarball (faster, avoids large
          # multi-file upload stalls). Captures the production URL it prints.
          URL=$(vercel deploy --prebuilt --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Alias to canonical domain
        if: steps.gate.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        # Ensure the canonical alias always points at THIS deploy, so
        # paulshotel-bhedetar.vercel.app is never stale vs the latest push.
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" paulshotel-bhedetar.vercel.app \
            --token=${{ secrets.VERCEL_TOKEN }} || echo "alias step non-fatal"

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
