name: Deploy

# Production CD to Vercel on every push to main.
#
# Triggered DIRECTLY by push-to-main (not via workflow_run) so it can never be
# orphaned or cancelled by unrelated CI runs. The job re-runs the quality gate
# (lint + types + build) first, then deploys.
#
# DORMANT until secrets exist: with no VERCEL_TOKEN the deploy step is skipped
# cleanly and the run still goes green ("coming soon"). Add VERCEL_TOKEN,
# VERCEL_ORG_ID, VERCEL_PROJECT_ID as repo secrets and the next push goes live.
#
# Note: PR preview deployments are handled by Vercel's own Git integration
# (no token in CI), so no token is ever exposed to untrusted fork PR code.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# Never interrupt an in-flight production deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: vercel-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Quality gate — production must never ship a red build.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://paulshotel-bhedetar.vercel.app

      # Secret gate: only deploy when a Vercel token is configured.
      - name: Check for Vercel secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::No VERCEL_TOKEN/ORG_ID/PROJECT_ID yet. Build is green; add the secrets to go live."
          fi

      - name: Install Vercel CLI
        if: steps.gate.outputs.ready == 'true'
        run: npm i -g vercel@latest

      - name: Pull Vercel env
        if: steps.gate.outputs.ready == 'true'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Vercel build
        if: steps.gate.outputs.ready == 'true'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to $URL"

      - name: Summary
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
