version: 2

# Low-noise, security-first policy.
#
# Routine MINOR + PATCH bumps are collapsed into ONE weekly PR per ecosystem.
# MAJOR bumps of the toolchain/runtime are ignored — they break the strict
# build/lint or change a hand-tuned API, so they need a deliberate migration
# PR, not an automated one. Dependabot SECURITY updates are always delivered
# regardless of these `ignore` rules, so we stay patched without the spam.

updates:
  # ---------------------------------------------------------------------------
  # npm dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"

    groups:
      # One PR for all routine minor/patch upgrades. Majors stay out (ignored
      # below) so this PR is always safe to merge after CI is green.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

    ignore:
      # --- Toolchain / runtime majors: migrate deliberately, never auto-bump ---
      # eslint v10 breaks eslint-config-next / eslint-plugin-react today
      # ("contextOrFilename.getFilename is not a function").
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript majors can change type-checking semantics; bump with intent.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node MUST track the Node major we actually run on (Node 22).
      # Block anything that would jump the type defs ahead of the runtime.
      - dependency-name: "@types/node"
        versions: [">=23"]

      # --- Framework / breaking-API deps: pinned, migrate by hand ---
      # next majors are migrations (App Router/config churn), not bumps.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # React majors must move with the whole RSC/types ecosystem together.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # cobe v2 removed `onRender` from COBEOptions, which the globe components
      # depend on. tailwind v5 is a config migration. tiptap majors are breaking.
      - dependency-name: "cobe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tiptap/*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions — keep runners/actions current (security + Node deprecations)
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kathmandu
    open-pull-requests-limit: 5
    labels:
      - "type: chore"
      - "type: security"
    commit-message:
      prefix: "ci"
    groups:
      # One PR for all action updates.
      actions:
        patterns:
          - "*"
